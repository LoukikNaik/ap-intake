[project]
name = "ap-intake-backend"
version = "0.1.0"
description = "AP Intake Platform — agent-first invoice processing for Lonestar Commercial Construction"
requires-python = ">=3.11"
dependencies = [
    "openai-agents>=0.0.13",
    "litellm>=1.51.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.12",
    "pymupdf>=1.24.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
