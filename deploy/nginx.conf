# Nginx reverse proxy for the AP Intake backend.
#
# Purpose: terminate HTTPS on your machine and forward requests to the FastAPI backend
# (uvicorn on 127.0.0.1:8000, started by `docker compose up`). HTTPS is REQUIRED because
# the UI is served from GitHub Pages over HTTPS, and browsers block an HTTPS page from
# calling an http:// API (mixed content).
#
# Replace api.example.com with your domain. Get a cert with:
#   sudo certbot --nginx -d api.example.com
#
# CORS is handled by the FastAPI app (CORS_ORIGINS env) — do NOT also add CORS headers here,
# or you'll get duplicate-header errors.

server {
    listen 80;
    server_name api.example.com;
    # Redirect everything to HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    # PDFs are small, but give uploads headroom.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Agent processing happens in the background (the POST returns 202 immediately),
        # but give read operations comfortable headroom anyway.
        proxy_read_timeout 120s;
    }
}
