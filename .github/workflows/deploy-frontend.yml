name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: write # JamesIves action pushes the build to the gh-pages branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          CI: false
          # Set as repo Variables (Settings → Secrets and variables → Actions → Variables):
          #   VITE_API_URL = public HTTPS URL of your backend (e.g. https://ap-api.loukik.dev)
          #   VITE_BASE    = "/" with a custom domain, or "/<repo>/" for a project site
          #   VITE_CNAME   = (optional) custom domain to serve from, e.g. ap.loukik.dev
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_BASE: ${{ vars.VITE_BASE }}

      - name: SPA fallback (clean URLs work on direct load / refresh)
        run: cp frontend/dist/index.html frontend/dist/404.html

      - name: Custom domain (optional)
        if: ${{ vars.VITE_CNAME != '' }}
        run: echo "${{ vars.VITE_CNAME }}" > frontend/dist/CNAME

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: frontend/dist
          branch: gh-pages
